name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    # A clean upstream update calls this workflow directly. Its main-branch
    # push carries this trailer so the push event does not deploy the same
    # Worker a second time.
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'Upstream-Deployment: reusable')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Predeploy guard
        run: npm run predeploy

      - name: Write deploy Wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          OAUTH_KV_NAMESPACE_ID: ${{ secrets.OAUTH_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail

          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID OAUTH_KV_NAMESPACE_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          node scripts/write-deploy-config.mjs wrangler.jsonc wrangler.deploy.json

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing required GitHub secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          npx wrangler deploy --config wrangler.deploy.json

      - name: Restore required Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECOND_BRAIN_TOKEN: ${{ secrets.SECOND_BRAIN_TOKEN }}
          RELEASE_NOTIFY_TOKEN: ${{ secrets.RELEASE_NOTIFY_TOKEN }}
        run: |
          set -euo pipefail

          missing=0
          for name in CLOUDFLARE_API_TOKEN SECOND_BRAIN_TOKEN RELEASE_NOTIFY_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          printf '%s' "$SECOND_BRAIN_TOKEN" \
            | npx wrangler secret put AUTH_TOKEN --config wrangler.deploy.json
          printf '%s' "$RELEASE_NOTIFY_TOKEN" \
            | npx wrangler secret put RELEASE_NOTIFY_TOKEN --config wrangler.deploy.json

      - name: Email a manually resolved upstream release
        if: github.event_name == 'push'
        env:
          SECOND_BRAIN_URL: ${{ secrets.SECOND_BRAIN_URL }}
          RELEASE_NOTIFY_TOKEN: ${{ secrets.RELEASE_NOTIFY_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          state_file=".github/upstream-release.json"
          if [[ ! -f "$state_file" ]]; then
            echo "No upstream release state is recorded; no release email needed."
            exit 0
          fi

          current_state="$(jq -cS . "$state_file")"
          previous_state="$(git show "${GITHUB_SHA}^1:${state_file}" 2>/dev/null | jq -cS . 2>/dev/null || true)"
          if [[ "$current_state" == "$previous_state" ]]; then
            echo "Upstream release state is unchanged; no release email needed."
            exit 0
          fi

          missing=0
          for name in SECOND_BRAIN_URL RELEASE_NOTIFY_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          release_tag="$(jq -er '.releaseTag | select(type == "string" and length > 0)' "$state_file")"
          release_name="$(jq -er '.releaseName | select(type == "string" and length > 0)' "$state_file")"
          release_url="$(jq -er '.releaseUrl | select(type == "string" and startswith("https://github.com/") and contains("/releases/"))' "$state_file")"

          payload="$(jq -n \
            --arg release_tag "$release_tag" \
            --arg release_name "$release_name" \
            --arg release_url "$release_url" \
            --arg action_url "$RUN_URL" \
            '{
              releaseTag: $release_tag,
              releaseName: $release_name,
              releaseUrl: $release_url,
              status: "applied",
              details: "",
              actionUrl: $action_url
            }')"

          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${RELEASE_NOTIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "${SECOND_BRAIN_URL%/}/internal/release-notification")"

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]] || ! jq -e '.ok == true' "$response_file" >/dev/null; then
            echo "::error::Release notification failed with HTTP ${http_status}"
            cat "$response_file"
            exit 1
          fi

          message_id="$(jq -r '.messageId // "unknown"' "$response_file")"
          {
            echo "### Emailed manually resolved release ${release_tag}"
            echo
            echo "Recipient: dan@infoaddict.net"
            echo
            echo "Release notes: ${release_url}"
            echo
            echo "Cloudflare message ID: ${message_id}"
          } >> "$GITHUB_STEP_SUMMARY"
